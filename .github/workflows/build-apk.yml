name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "3.5.3"
    steps:
      - uses: actions/checkout@v4

      - name: Scarica solo i modelli usati (Git LFS)
        run: |
          git lfs pull --exclude="models/unused/*"
          rm -rf models/unused
          for f in models/Alice/alice.glb models/lily/lily.glb models/anata/anata.glb; do
            s=$(stat -c%s "$f")
            echo "$f = $s byte"
            if [ "$s" -lt 100000 ]; then
              echo "ERRORE: $f e' ancora un segnaposto LFS (quota LFS esaurita?)"; exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa Godot e template di export
        run: |
          V=$GODOT_VERSION
          B=https://github.com/godotengine/godot/releases/download/${V}-stable
          wget -q $B/Godot_v${V}-stable_linux_headless.64.zip
          unzip -q Godot_v${V}-stable_linux_headless.64.zip
          sudo mv Godot_v${V}-stable_linux_headless.64 /usr/local/bin/godot
          wget -q $B/Godot_v${V}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/templates/${V}.stable tpl
          unzip -q Godot_v${V}-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/templates/${V}.stable/
          godot --version || true

      - name: Android SDK e keystore di debug
        run: |
          SDK=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3" "platform-tools" "platforms;android-29"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore $HOME/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-3.tres <<TRES
          [gd_resource type="EditorSettings" format=2]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          TRES

      - name: Preset di export Android
        run: |
          cat > export_presets.cfg <<'CFG'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter="models/unused/*, *.md, jietu*.png"
          export_path="build/openSizebox.apk"
          script_export_mode=1
          script_encryption_key=""

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          custom_build/use_custom_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug=""
          keystore/release=""
          version/code=1
          version/name="1.0"
          package/unique_name="com.opensizebox.mobile"
          package/name="openSizebox"
          package/signed=true
          package/classify_as_game=true
          screen/immersive_mode=true
          CFG

      - name: Adatta per touch (tasti, camera, schermo)
        run: |
          mkdir -p script/touch
          cat > script/touch/TouchControls.gd <<'GD'
          extends CanvasLayer
          # Controlli touch per openSizebox (port mobile).
          # Sono TouchScreenButton, quindi funzionano in multi-touch:
          # si puo' tenere premuto avanti e trascinare l'altro dito per guardare.

          const D = 96
          var root
          var items = []
          var look_fingers = {}
          var sens = 1.0
          var tex_up
          var tex_down
          var diag
          var diag_t = 0.0

          func _ready():
              layer = 100
              if not OS.has_touchscreen_ui_hint():
                  set_process(false)
                  set_process_input(false)
                  return
              root = Node2D.new()
              add_child(root)
              diag = Label.new()
              diag.modulate = Color(1, 1, 1, 0.6)
              diag.align = Label.ALIGN_CENTER
              diag.rect_min_size = Vector2(320, 16)
              add_child(diag)
              tex_up = _circle_tex(D, Color(1, 1, 1, 0.28))
              tex_down = _circle_tex(D, Color(1, 1, 1, 0.6))
              _add("FWD", "walk")
              _add("BACK", "walk_back")
              _add("JUMP", "jump")
              _add("FLY", "fly")
              _add("DOWN", "q")
              _add("BIG", "grow")
              _add("SMALL", "small")
              _add("MENU", "editMode")
              _add("RESET", "r")
              get_viewport().connect("size_changed", self, "_layout")
              _layout()

          func _circle_tex(d, col):
              var img = Image.new()
              img.create(d, d, false, Image.FORMAT_RGBA8)
              img.lock()
              var r = d / 2.0
              for y in range(d):
                  for x in range(d):
                      var dist = Vector2(x + 0.5 - r, y + 0.5 - r).length()
                      if dist <= r - 1.5:
                          img.set_pixel(x, y, col)
                      elif dist <= r:
                          img.set_pixel(x, y, Color(col.r, col.g, col.b, col.a * 0.5))
              img.unlock()
              var t = ImageTexture.new()
              t.create_from_image(img, 0)
              return t

          func _add(label, action):
              var b = TouchScreenButton.new()
              b.normal = tex_up
              b.pressed = tex_down
              b.action = action
              var l = Label.new()
              l.text = label
              l.rect_position = Vector2(8, D / 2.0 - 8)
              l.rect_min_size = Vector2(D - 16, 16)
              l.align = Label.ALIGN_CENTER
              b.add_child(l)
              root.add_child(b)
              items.append(b)

          func _layout():
              var s = get_viewport().get_visible_rect().size
              var m = 24
              diag.rect_position = Vector2(s.x / 2.0 - 160, 2)
              var pos = {
                  "FWD": Vector2(m, s.y - 2 * D - 2 * m),
                  "BACK": Vector2(m, s.y - D - m),
                  "JUMP": Vector2(s.x - D - m, s.y - D - m),
                  "FLY": Vector2(s.x - 2 * D - 2 * m, s.y - D - m),
                  "DOWN": Vector2(s.x - D - m, s.y - 2 * D - 2 * m),
                  "BIG": Vector2(m, m),
                  "SMALL": Vector2(2 * m + D, m),
                  "MENU": Vector2(s.x - D - m, m),
                  "RESET": Vector2(s.x - 2 * D - 2 * m, m),
              }
              for b in items:
                  b.position = pos[b.get_child(0).text]

          func _on_button(p):
              for b in items:
                  if Rect2(b.position, Vector2(D, D)).grow(12).has_point(p):
                      return true
              return false

          func _process(delta):
              var sc = get_tree().current_scene
              diag_t += delta
              if diag_t > 0.5:
                  diag_t = 0.0
                  var nm = "-"
                  if sc != null:
                      nm = sc.name
                  diag.text = nm + "  fps " + str(Engine.get_frames_per_second()) + "  mem " + str(OS.get_static_memory_usage() / 1048576) + "MB"
              var show = sc != null and sc.name == "Game"
              if show:
                  var tab = sc.get_node_or_null("Tab")
                  if tab != null and tab.visible:
                      show = false
              if root.visible != show:
                  root.visible = show
                  if not show:
                      look_fingers.clear()

          func _input(event):
              if not root.visible:
                  return
              if event is InputEventScreenTouch:
                  if event.pressed:
                      look_fingers[event.index] = not _on_button(event.position)
                  else:
                      look_fingers.erase(event.index)
              elif event is InputEventScreenDrag:
                  if look_fingers.get(event.index, false):
                      var sc = get_tree().current_scene
                      var h = sc.get_node_or_null("player/anata/h")
                      if h != null and h.has_method("touch_look"):
                          h.touch_look(event.relative * sens)
          GD
          cat > mobile_patch.py <<'PY'
          # Adatta il progetto a Android/touch. Eseguito dalla radice del progetto.
          p = open('project.godot', encoding='utf-8').read()
          p = p.replace('window/stretch/aspect="keep"', 'window/stretch/aspect="expand"')
          p = p.replace('window/stretch/mode="2d"', 'window/stretch/mode="viewport"')
          lines = p.split('\n')
          if '[display]' in lines:
              lines.insert(lines.index('[display]') + 1, 'window/handheld/orientation=0')
          else:
              lines += ['', '[display]', '', 'window/handheld/orientation=0']
          if '[rendering]' in lines:
              lines.insert(lines.index('[rendering]') + 1, 'quality/driver/driver_name="GLES2"')
          else:
              lines += ['', '[rendering]', '', 'quality/driver/driver_name="GLES2"']
          lines += ['', '[autoload]', '', 'TouchControls="*res://script/touch/TouchControls.gd"', '']
          open('project.godot', 'w', encoding='utf-8').write('\n'.join(lines))

          # Camera: sul telefono il mouse emulato dal tocco non deve girare la camera
          # (lo fa TouchControls con il trascinamento), e serve una funzione touch_look.
          t = open('script/Third.gd', encoding='utf-8').read()
          old = 'if event is InputEventMouseMotion and track_mouse:'
          assert old in t, 'Third.gd: riga della camera non trovata'
          t = t.replace(old, 'if event is InputEventMouseMotion and track_mouse and not OS.has_touchscreen_ui_hint():')
          t += '\nfunc touch_look(rel):\n'
          t += '\tif not track_mouse:\n\t\treturn\n'
          t += '\t$v.rotation.x = clamp($v.rotation.x, -1.4, 1.7)\n'
          t += '\trotate_object_local(Vector3.UP, -rel.x * mouse_sense)\n'
          t += '\t$v.rotate_object_local(Vector3.RIGHT, -clamp(rel.y, -30, 30) * mouse_sense)\n'
          open('script/Third.gd', 'w', encoding='utf-8').write(t)
          print('patch ok')

          env = '[gd_resource type="Environment" format=2]\n\n[resource]\n'
          env += 'background_mode = 1\nbackground_color = Color( 0.55, 0.7, 0.9, 1 )\n'
          env += 'ambient_light_color = Color( 0.75, 0.75, 0.8, 1 )\nambient_light_energy = 1.0\n'
          open('default_env.tres', 'w', encoding='utf-8').write(env)
          print('ambiente leggero ok')
          PY
          python3 mobile_patch.py

      - name: Importa risorse
        run: timeout 900 godot --path . --editor --quit || true

      - name: Esporta APK
        run: |
          mkdir -p build
          godot --path . --export-debug "Android" build/openSizebox.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: openSizebox-apk
          path: build/openSizebox.apk
